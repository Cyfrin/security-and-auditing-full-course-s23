name: Video Mistake
description: File an issue when Patrick made a mistake in the video.
labels: ["video-bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please ensure that the bug has not already been filed in the issue tracker.

        Thanks for taking the time to report this bug!
  - type: dropdown
    attributes:
      label: Section
      description: Which section is this an issue for?
      multiple: false
      options:
        - Section 0
        - Section 1
        - Section 2
        - Section 3
        - Section 4
        - Section 5
        - Section 6
        - Section 7
        - Section 7.5
        - Section 8
        - Other (please describe)
    validations:
      required: true
  - type: input
    attributes:
      label: Could you please leave a link to the timestamp in the video where this error occurs? (You can right click a video and "copy video URL at current time")
      placeholder: "https://www.youtube.com/watch?v=xyz&t=21247s"
  - type: textarea
    attributes:
      label: Describe the bug
      description: Please include relevant code snippets as well if relevant. Remember to format!
    validations:
      required: true
